hero:
  heading: Adaptive Leadership for meaningful change
  body: >
    I help individuals, groups, and communities navigate complex situations
    where the path forward isn’t obvious.
    The work focuses on increasing clarity,
    restoring agency,
    and developing the capacity to respond wisely
    when circumstances are changing.
  image: /assets/images/profile.jpg
  image_alt: Michael Basil

moment:
  heading: When knowing isn't enough
  paragraphs:
    - >
      In complex situations, more information or advice
      often does not create movement.
      The challenge is rarely a lack of intelligence
      or effort.
    - >
      What is needed is the ability to see the system more clearly,
      recognize patterns,
      and choose responses that create meaningful change.

credibility:
  line: >
    My work is informed by my training as a certified Zen Leadership instructor
    through the <a href="https://zenleader.global">Institute for Zen Leadership</a>.

situations:
  heading: Where Adaptive Leadership helps

  items:
    - subheading: Individuals navigating complexity
      paragraphs:
        - >
          You are facing a situation where the stakes are real,
          other people are involved,
          and the obvious answers are not working.
        - >
          The work helps you increase your agency,
          understand patterns,
          and choose how you want to engage.
      link:
        url: /individuals/
        label: Adaptive Leadership for Individuals

    - subheading: Groups working through change
      paragraphs:
        - >
          Teams and groups often get stuck in recurring patterns,
          competing perspectives,
          or unclear ways of working together.
        - >
          The work supports clearer communication,
          better decisions,
          and more adaptive responses.
      link:
        url: /groups/
        label: Adaptive Leadership for Groups

    - subheading: Communities building capacity
      paragraphs:
        - >
          Communities face challenges that no individual
          can solve alone.
        - >
          The work supports shared understanding,
          collective learning,
          and the ability to navigate complexity together.
      link:
        url: /communities/
        label: Adaptive Leadership for Communities

closing:
  line: >
    Meaningful change begins with how we choose to engage
    with the situation we are already part of.
