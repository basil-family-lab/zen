---
layout: default
---

<section id="hero">
  <h1>{{ page.title }}</h1>

  {% if page.subtitle %}
    <p><em>{{ page.subtitle }}</em></p>
  {% endif %}

  {% if page.lede %}
    <p>{{ page.lede }}</p>
  {% endif %}

  {% assign hero_image = page.image | default: '/assets/images/profile.jpg' %}
  <img
    src="{{ hero_image | relative_url }}"
    alt="{{ page.image_alt | default: site.profile.name }}"
    class="profile-image"
  />
</section>

<section id="origin">
  {{ content }}
</section>
