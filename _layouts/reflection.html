---
layout: default
---

<section id="hero">
  <h1>{{ page.title }}</h1>

  {% if page.date %}
    <p class="publish-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  {% endif %}

  {% if page.subtitle %}
    <p><em>{{ page.subtitle }}</em></p>
  {% endif %}
</section>

<section id="reflection">
  {{ content }}
</section>
